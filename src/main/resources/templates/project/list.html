<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title th:text="#{project.list.title}">Projects</title>
</head>
<body>
<main>
    <div class="page-header">
        <h1 th:text="#{project.list.title}">Projects</h1>
        <a class="btn btn-primary" th:href="@{/projects/new}" th:text="#{project.new}">New project</a>
    </div>

    <div class="empty-state card"
         th:if="${projects.totalElements == 0 and #strings.isEmpty(q) and status == null}">
        <h2 th:text="#{project.empty.title}">No projects yet</h2>
        <p th:text="#{project.empty.text}">Create your first project to start planning tasks.</p>
        <a class="btn btn-primary" th:href="@{/projects/new}" th:text="#{project.create}">Create project</a>
    </div>

    <th:block th:unless="${projects.totalElements == 0 and #strings.isEmpty(q) and status == null}">

        <form class="filters" method="get" th:action="@{/projects}">
            <div class="field">
                <label for="q" th:text="#{project.search.label}">Search projects</label>
                <input id="q" name="q" type="search" th:value="${q}"
                       th:placeholder="#{project.search.placeholder}">
            </div>
            <div class="field">
                <label for="status" th:text="#{project.status.label}">Status</label>
                <select id="status" name="status">
                    <option value="" th:text="#{project.status.all}">All statuses</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == status}"
                            th:text="#{status.__${s}__}">To do</option>
                </select>
            </div>
            <button class="btn btn-secondary" type="submit" th:text="#{action.filter}">Filter</button>
        </form>

        <p th:if="${projects.totalElements == 0}" th:text="#{project.noMatches}">
            No projects match your search.</p>

        <table class="data-table" th:if="${projects.totalElements > 0}">
            <thead>
            <tr>
                <th scope="col" th:text="#{project.column.name}">Name</th>
                <th scope="col" th:text="#{project.column.lead}">Lead</th>
                <th scope="col" th:text="#{project.column.dueDate}">Due date</th>
                <th scope="col" th:text="#{project.column.status}">Status</th>
                <th scope="col" th:text="#{project.column.tasks}">Tasks</th>
                <th scope="col"><span class="visually-hidden" th:text="#{table.actions}">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${projects.content}">
                <td><a th:href="@{/projects/{id}(id=${p.id})}" th:text="${p.name}">Website Redesign</a></td>
                <td th:text="${p.leadName}">Michael Chen</td>
                <td th:text="${#temporals.format(p.dueDate, #messages.msg('date.format'))}">15.12.2026.</td>
                <td><span class="chip" th:classappend="'chip-' + ${p.status}"
                          th:text="#{status.__${p.status}__}">In progress</span></td>
                <td th:text="${p.taskCount}">20</td>
                <td>
                    <div class="row-actions">
                        <a class="icon-btn" th:href="@{/projects/{id}/edit(id=${p.id})}"
                           th:aria-label="#{project.editNamed(${p.name})}" th:title="#{project.edit}">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>
                            </svg>
                        </a>
                        <form method="post" th:action="@{/projects/{id}/delete(id=${p.id})}"
                              th:data-confirm="#{project.delete.confirm(${p.name})}">
                            <button class="icon-btn icon-btn-danger" type="submit"
                                    th:aria-label="#{project.deleteNamed(${p.name})}" th:title="#{project.delete}">
                                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <nav class="pagination" th:if="${projects.totalPages > 1}" th:aria-label="#{pagination.label}">
            <a th:if="${projects.hasPrevious()}"
               th:href="@{/projects(q=${q}, status=${status}, page=${projects.number - 1})}"
               th:text="#{pagination.previous}">Previous</a>
            <th:block th:each="i : ${#numbers.sequence(0, projects.totalPages - 1)}">
                <a th:href="@{/projects(q=${q}, status=${status}, page=${i})}" th:text="${i + 1}"
                   th:attr="aria-current=${i == projects.number} ? 'page' : null">1</a>
            </th:block>
            <a th:if="${projects.hasNext()}"
               th:href="@{/projects(q=${q}, status=${status}, page=${projects.number + 1})}"
               th:text="#{pagination.next}">Next</a>
        </nav>
    </th:block>
</main>
</body>
</html>
