<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<dialog id="confirm-dialog" class="dialog" th:fragment="dialog" aria-labelledby="confirm-dialog-title">
    <form method="dialog">
        <h2 id="confirm-dialog-title" th:text="#{dialog.confirm.title}">Are you sure?</h2>
        <p data-confirm-text></p>
        <div class="dialog-actions">
            <button class="btn btn-secondary" value="cancel" autofocus th:text="#{action.cancel}">Cancel</button>
            <button class="btn btn-danger" type="button" data-confirm-ok th:text="#{action.delete}">Delete</button>
        </div>
    </form>
</dialog>
</body>
</html>
