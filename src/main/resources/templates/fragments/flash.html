<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Flash messages fragment</title>
</head>
<body>
...
<div class="flash-area" th:fragment="flash">

    <output class="flash flash-success" th:if="${successMessage}">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
        </svg>
        <span th:text="#{${successMessage}}">Saved.</span>
        <button type="button" class="flash-close" th:aria-label="#{flash.close}"
                onclick="this.parentElement.remove()">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>
        </button>
    </output>

    <div class="flash flash-error" role="alert" th:if="${errorMessage}">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
        </svg>
        <span th:text="#{${errorMessage}}">Something went wrong.</span>
        <button type="button" class="flash-close" th:aria-label="#{flash.close}"
                onclick="this.parentElement.remove()">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>
        </button>
    </div>

</div>
</body>
</html>
